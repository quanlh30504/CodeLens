name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo --redact --no-banner --verbose
      - name: Fail on private key material in tracked files
        run: |
          set -euo pipefail
          if git grep -nE -e '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----' -- . ':!.github/workflows/secret-scan.yml'; then
            echo "Private key material found in tracked files" >&2
            exit 1
          fi

  scan-images:
    runs-on: ubuntu-latest
    if: hashFiles('deploy/docker-compose.yml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build
      - name: Scan built images for private keys and secrets
        run: |
          set -euo pipefail
          for image in $(docker compose -f deploy/docker-compose.yml config --images); do
            docker image inspect "$image" >/dev/null 2>&1 || continue
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --scanners secret --exit-code 1 "$image"
          done
